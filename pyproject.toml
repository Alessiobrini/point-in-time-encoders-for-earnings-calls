[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecalls"
version = "0.1.0"
description = "Survivorship-bias-free earnings call transcript corpus from WRDS Capital IQ"
requires-python = ">=3.11"
# Deliberately empty: the environment is built from environment.yml + requirements.txt, and
# `pip install -e . --no-deps` wires the package without touching it.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
