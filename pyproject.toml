[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecalls"
version = "0.1.0"
description = "Point-in-time encoders for earnings calls: corpus, training, evaluation and paper exhibits"
requires-python = ">=3.11"
# Empty on purpose: the environment is built from environment.yml + requirements.txt, and
# `pip install -e . --no-deps` wires the package without touching it.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
